[project]
name = "plant-tests"
version = "0.1.0"
description = "Cross-service tests for Project Plant"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "jsonschema>=4.21",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "testcontainers>=4.0",
    "websockets>=12.0",
    "pytest-timeout>=2.2",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

# This project is a test harness, not an importable library — install it only
# to pull in the dependencies above (`pip install -e .`).
[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["contract", "e2e"]
asyncio_mode = "auto"
markers = [
    "contract: contract/schema validation tests",
    "e2e: end-to-end tests requiring full stack",
]
